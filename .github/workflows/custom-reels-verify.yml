name: Custom Reels regression verification
on:
  push:
    branches: ['custom/preview-scroll-ack']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/custom-reels-verify.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all regression tests
        run: npm test
      - name: Build web assets
        run: npm run build

  ffmpeg-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify production frame transport with real H.264 encoder
        run: node scripts/validate-frame-pipeline-media.cjs

  native-utility-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install native Electron and FFmpeg prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Encode 30 real frames through native Electron utilityProcess and MessageChannelMain
        run: xvfb-run -a ./node_modules/.bin/electron scripts/validate-vkk-native-utility-ack.cjs --no-sandbox
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'

  windows-native-utility-ack:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure FFmpeg and FFprobe are available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - name: Verify native Windows MessageChannelMain and utilityProcess encoding
        shell: pwsh
        run: .\\node_modules\\.bin\\electron.cmd scripts/validate-vkk-native-utility-ack.cjs
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [regression, windows-native-utility-ack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Supply tested FFmpeg and FFprobe in packaged vendor folder
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          if (-not $binary) { throw 'Cannot locate Windows FFmpeg distribution for self-contained test build' }
          $binDir = Join-Path 'vendor/windows/ffmpeg' 'bin'
          New-Item -ItemType Directory -Force $binDir | Out-Null
          Copy-Item $binary.FullName (Join-Path $binDir 'ffmpeg.exe')
          Copy-Item (Join-Path $binary.DirectoryName 'ffprobe.exe') (Join-Path $binDir 'ffprobe.exe')
          & (Join-Path $binDir 'ffmpeg.exe') -version
      - name: Build unsigned Windows test installer without publishing
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Package truly portable x64 directory as ZIP
        shell: pwsh
        run: |
          $folder = 'dist-electron/win-unpacked'
          $binary = Join-Path $folder 'VideoKit.exe'
          $ffmpeg = Join-Path $folder 'resources/vendor/ffmpeg/bin/ffmpeg.exe'
          $ffprobe = Join-Path $folder 'resources/vendor/ffmpeg/bin/ffprobe.exe'
          foreach ($required in @($binary, $ffmpeg, $ffprobe)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Portable ZIP missing required file: $required" }
          }
          $zipPath = 'dist-electron/VideoKit-Reels-ACK-Portable-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path $zipPath -PathType Leaf)) { throw 'Portable ZIP was not created' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = $archive.Entries | ForEach-Object FullName
            foreach ($required in @('VideoKit.exe', 'resources/vendor/ffmpeg/bin/ffmpeg.exe', 'resources/vendor/ffmpeg/bin/ffprobe.exe')) {
              if ($names -notcontains $required) { throw "Portable archive missing required entry: $required" }
            }
            Write-Host "Portable ZIP verified: $($archive.Entries.Count) entries"
          } finally { $archive.Dispose() }
          Get-Item $zipPath | Select-Object Name,Length
      - name: Upload portable Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vkk-reels-ack-windows-portable-x64
          path: dist-electron/VideoKit-Reels-ACK-Portable-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload test-only installer
        uses: actions/upload-artifact@v4
        with:
          name: vkk-reels-ack-windows-test-installer
          path: dist-electron/*.exe
          retention-days: 7
          if-no-files-found: error
