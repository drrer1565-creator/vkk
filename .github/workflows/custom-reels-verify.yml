name: Custom Reels regression verification
on:
  push:
    branches: ['custom/preview-scroll-ack']
  pull_request:
    branches: [main, 'custom/preview-scroll-ack']
    paths:
      - 'src/**'
      - 'electron/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - '.github/workflows/custom-reels-verify.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a tested portable ZIP (explicit opt-in only)'
        type: boolean
        default: false
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all regression tests
        run: npm test
      - name: Build web assets
        run: npm run build

  ffmpeg-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify production frame transport with real H.264 encoder
        run: node scripts/validate-frame-pipeline-media.cjs

  native-utility-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install native Electron and FFmpeg prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Encode 30 real frames through native Electron utilityProcess and MessageChannelMain
        run: xvfb-run -a ./node_modules/.bin/electron scripts/validate-vkk-native-utility-ack.cjs --no-sandbox
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
      - name: Build and verify the production main, preload and isolated export lifecycle
        run: |
          npm run build
          xvfb-run -a ./node_modules/.bin/electron scripts/validate-export-responsiveness.cjs --no-sandbox
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
          VIDEOKIT_RESPONSIVENESS_DIR: ${{ runner.temp }}/vkk-app-export-source

  windows-native-utility-ack:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure FFmpeg and FFprobe are available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - name: Verify native Windows MessageChannelMain and utilityProcess encoding
        shell: pwsh
        run: .\\node_modules\\.bin\\electron.cmd scripts/validate-vkk-native-utility-ack.cjs
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'

  windows-installer:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [regression, windows-native-utility-ack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Supply tested FFmpeg and FFprobe in packaged vendor folder
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1
          if (-not $binary) { throw 'Cannot locate Windows FFmpeg distribution for self-contained test build' }
          $binDir = Join-Path 'vendor/windows/ffmpeg' 'bin'
          New-Item -ItemType Directory -Force $binDir | Out-Null
          Copy-Item $binary.FullName (Join-Path $binDir 'ffmpeg.exe')
          Copy-Item (Join-Path $binary.DirectoryName 'ffprobe.exe') (Join-Path $binDir 'ffprobe.exe')
          & (Join-Path $binDir 'ffmpeg.exe') -version
      - name: Prepare complete embedded Windows Python
        shell: pwsh
        run: ./scripts/prepare-windows-python.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled Python fallback dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-edge.txt yt-dlp requests --target vendor/windows/python/Lib/site-packages --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & vendor/windows/python/python.exe -I -c "import ctypes, edge_tts, yt_dlp; print('Bundled runtime imports OK')"
          exit $LASTEXITCODE
      - name: Build Windows portable directory without an installer
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --dir --win --x64
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Package truly portable x64 directory as ZIP
        # The package hook first checks the runtime; exercise its actual ASAR entry before ZIP/publish.
        if: success()
        shell: pwsh
        run: |
          $folder = 'dist-electron/win-unpacked'
          $binary = Join-Path $folder 'VideoKit.exe'
          $ffmpeg = Join-Path $folder 'resources/vendor/ffmpeg/bin/ffmpeg.exe'
          $ffprobe = Join-Path $folder 'resources/vendor/ffmpeg/bin/ffprobe.exe'
          $python = Join-Path $folder 'resources/vendor/python/python.exe'
          foreach ($required in @($binary, $ffmpeg, $ffprobe, $python)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Portable ZIP missing required file: $required" }
          }
          $zipPath = 'dist-electron/VideoKit-Reels-ACK-Portable-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path $zipPath -PathType Leaf)) { throw 'Portable ZIP was not created' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = $archive.Entries | ForEach-Object FullName
            foreach ($required in @('VideoKit.exe', 'resources/vendor/ffmpeg/bin/ffmpeg.exe', 'resources/vendor/ffmpeg/bin/ffprobe.exe', 'resources/vendor/python/python.exe', 'resources/vendor/python/python311.dll', 'resources/vendor/python/python311.zip', 'resources/vendor/python/_ctypes.pyd')) {
              if ($names -notcontains $required) { throw "Portable archive missing required entry: $required" }
            }
            Write-Host "Portable ZIP verified: $($archive.Entries.Count) entries"
          } finally { $archive.Dispose() }
          Get-Item $zipPath | Select-Object Name,Length
      - name: Verify the actual packaged main, preload, isolated renderer and embedded CPU helper
        shell: pwsh
        run: |
          $env:VIDEOKIT_MAIN_UNDER_TEST = (Resolve-Path 'dist-electron/win-unpacked/resources').Path + '/app.asar/electron/main.js'
          $env:VIDEOKIT_PACKAGED_RESOURCES = (Resolve-Path 'dist-electron/win-unpacked/resources').Path
          $env:VIDEOKIT_RESPONSIVENESS_DIR = "$env:RUNNER_TEMP/vkk-app-export-packaged"
          .\node_modules\.bin\electron.cmd scripts/validate-export-responsiveness.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "$env:VIDEOKIT_RESPONSIVENESS_DIR/results.json" -Raw | ConvertFrom-Json
          if (-not $report.pass -or $report.errorDialogs -ne 1 -or $report.frames.Count -ne 4) { throw 'Packaged production export verification incomplete' }
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
      - name: Publish portable ZIP directly to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = 'v4.5.1-reels-ack-template-search-portable-r2'
          $zip = 'dist-electron/VideoKit-Reels-ACK-Portable-Windows-x64.zip'
          if (-not (Test-Path $zip)) { throw 'Verified portable ZIP is missing' }
          $notes = @'
          VideoKit vkk - portable Windows x64 test build. Extract the ZIP, then run VideoKit.exe. No installer is needed.

          Changes: full-library live template search (including folders); direct-preview without whole-file SDR proxy; per-task scroll end and reset; utility-process ACK video export.
          Automated Windows/Linux regression tests passed. This is a PRE-RELEASE, not yet accepted against real production projects.
          Back up VideoKit projects and configuration before testing because this build uses the existing app identity and version.
          '@
          $releaseSha = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:GITHUB_SHA }
          # Create an empty prerelease first, then upload. A concurrent build may have created the tag already.
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $releaseSha --title 'VideoKit 4.5.1 ACK + Template Search Portable (Windows x64 test)' --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Release creation did not succeed; checking whether the tag already has a release.'
            gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create or find the target GitHub Release' }
          }
          gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset upload failed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify uploaded Release asset' }
      - name: Keep the verified portable candidate without publishing a Release
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vkk-export-startup-fix-${{ github.sha }}
          path: dist-electron/VideoKit-Reels-ACK-Portable-Windows-x64.zip
          retention-days: 3
